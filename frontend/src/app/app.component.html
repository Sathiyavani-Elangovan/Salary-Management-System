<div class="app-container">
  <nav class="navbar" *ngIf="isAuthenticated">
    <div class="nav-content">
      <div class="logo">
        <h2>💼 {{ title }}</h2>
      </div>
      <div class="nav-links" [class.open]="menuOpen">
        <a routerLink="/dashboard" routerLinkActive="active" (click)="menuOpen = false">
          📊 Dashboard
        </a>
        <a routerLink="/employees" routerLinkActive="active" (click)="menuOpen = false">
          👥 Employees
        </a>
        <a routerLink="/audit-logs" routerLinkActive="active" (click)="menuOpen = false">
          📋 Audit Logs
        </a>
      </div>
      <div class="user-section">
        <span class="user-info" *ngIf="currentUser">
          <span class="user-icon">👤</span>
          <span class="username">{{ currentUser.username }}</span>
          <span class="user-role">({{ currentUser.role }})</span>
        </span>
        <button class="logout-btn" (click)="logout()">
          Logout 🚪
        </button>
      </div>
      <button class="menu-toggle" (click)="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="footer" *ngIf="isAuthenticated">
    <p>&copy; 2026 ACME Corporation. Built with Angular + Micronaut.</p>
  </footer>
</div>
